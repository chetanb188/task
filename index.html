<style>
  :root {
    --bg: #0A0E17;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.08);
    --ink: #F0F2F5;
    --ink-dim: #8B95A5;
    --ink-faint: #4A5568;
    --line: rgba(255,255,255,0.06);
    --infra: #00D4AA;
    --infra-glow: rgba(0,212,170,0.25);
    --infra-soft: rgba(0,212,170,0.10);
    --dev: #FF8A5C;
    --dev-glow: rgba(255,138,92,0.25);
    --dev-soft: rgba(255,138,92,0.10);
    --accent-gradient: linear-gradient(135deg, #00D4AA 0%, #7B61FF 50%, #FF8A5C 100%);
    --radius-sm: 10px;
    --radius: 16px;
    --radius-lg: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle, rgba(0,212,170,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(255,138,92,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app { max-width: 920px; margin: 0 auto; position: relative; z-index: 1; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin: 0;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .sync-status:hover { background: rgba(255,255,255,0.06); }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .sync-dot.connected { background: var(--infra); box-shadow: 0 0 6px var(--infra-glow); }
  .sync-dot.connecting { background: #FFD666; animation: pulse 1.2s ease-in-out infinite; }
  .sync-dot.offline { background: var(--dev); }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .error-banner {
    display: none;
    background: var(--dev-soft);
    border: 1px solid rgba(255,138,92,0.3);
    color: var(--dev);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .error-banner.show { display: block; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }

  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--ink-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 14px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tab:active { transform: scale(0.97); }

  .tab.active {
    color: var(--ink);
    background: var(--surface-hover);
    border-color: var(--tab-accent, var(--glass-border));
    box-shadow: 0 0 20px var(--tab-glow, transparent);
  }
  .tab[data-lane="infra"].active {
    --tab-accent: var(--infra);
    --tab-glow: var(--infra-glow);
  }
  .tab[data-lane="developers"].active {
    --tab-accent: var(--dev);
    --tab-glow: var(--dev-glow);
  }

  .tab .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: rgba(255,255,255,0.08);
    color: var(--ink-dim);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .tab.active .count-badge {
    color: var(--ink);
    background: rgba(255,255,255,0.12);
  }

  .lanes { display: grid; grid-template-columns: 1fr; gap: 16px; }

  .lane {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: border-color 0.3s ease;
  }
  .lane[data-lane="infra"]:hover { border-color: rgba(0,212,170,0.2); }
  .lane[data-lane="developers"]:hover { border-color: rgba(255,138,92,0.2); }

  .lane-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .dot.infra { background: var(--infra); box-shadow: 0 0 8px var(--infra-glow); }
  .dot.developers { background: var(--dev); box-shadow: 0 0 8px var(--dev-glow); }
  .dot.unassigned { background: var(--ink-dim); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .lane-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    flex: 1;
    color: var(--ink);
  }

  .lane-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    background: rgba(255,255,255,0.06);
    padding: 3px 10px;
    border-radius: 20px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  .lane-count.flash.infra { color: var(--infra); transform: scale(1.2); text-shadow: 0 0 8px var(--infra-glow); }
  .lane-count.flash.developers { color: var(--dev); transform: scale(1.2); text-shadow: 0 0 8px var(--dev-glow); }

  .quick-add {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: border-color 0.25s ease;
  }
  .quick-add:focus-within {
    border-color: rgba(123,97,255,0.4);
    box-shadow: 0 0 24px rgba(123,97,255,0.1);
  }

  .quick-add input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .quick-add input:focus {
    outline: none;
    border-color: rgba(123,97,255,0.5);
    background: rgba(255,255,255,0.06);
  }
  .quick-add input::placeholder { color: var(--ink-faint); }

  .add-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: var(--accent-gradient);
    border: none;
    color: #fff;
    padding: 13px 20px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(123,97,255,0.3); }
  .add-btn:active { transform: scale(0.96); }

  .unassigned-lane { margin-bottom: 18px; }
  .assign-row { display: flex; gap: 6px; }
  .assign-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: transparent;
    border: 1px solid;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .assign-btn.infra { border-color: var(--infra); color: var(--infra); }
  .assign-btn.infra:hover { background: var(--infra); color: var(--bg); box-shadow: 0 0 12px var(--infra-glow); }
  .assign-btn.developers { border-color: var(--dev); color: var(--dev); }
  .assign-btn.developers:hover { background: var(--dev); color: var(--bg); box-shadow: 0 0 12px var(--dev-glow); }
  .assign-btn:active { transform: scale(0.95); }

  .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

  .task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px;
    border-radius: var(--radius-sm);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .task-row:hover { background: rgba(255,255,255,0.03); }
  .task-row.removing { opacity: 0; transform: translateX(16px) scale(0.97); }
  .task-row.removing .task-text { text-decoration: line-through; color: var(--ink-faint); }

  .task-text { flex: 1; font-size: 14px; line-height: 1.5; word-break: break-word; color: var(--ink); }
  .task-text.done { text-decoration: line-through; color: var(--ink-faint); }

  .task-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .row-actions { display: flex; align-items: center; gap: 2px; }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.2s ease;
  }
  .task-row:hover .icon-btn { opacity: 0.5; }
  .icon-btn:hover { opacity: 1 !important; background: rgba(255,255,255,0.08); }

  .done-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .done-btn:active { transform: scale(0.88); }
  .done-btn.infra { border: 2px solid var(--infra); color: var(--infra); }
  .done-btn.infra:hover { background: var(--infra); color: var(--bg); box-shadow: 0 0 16px var(--infra-glow); }
  .done-btn.developers { border: 2px solid var(--dev); color: var(--dev); }
  .done-btn.developers:hover { background: var(--dev); color: var(--bg); box-shadow: 0 0 16px var(--dev-glow); }
  .task-row.done .done-btn { background: rgba(255,255,255,0.05); border-color: var(--ink-faint); color: var(--ink-faint); }

  .edit-input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(123,97,255,0.5);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    outline: none;
    box-shadow: 0 0 16px rgba(123,97,255,0.15);
  }
  .edit-actions { display: flex; gap: 6px; }
  .mini-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mini-btn.save { background: var(--accent-gradient); color: #fff; }
  .mini-btn.save:hover { box-shadow: 0 2px 12px rgba(123,97,255,0.3); }
  .mini-btn.cancel { background: rgba(255,255,255,0.06); color: var(--ink-dim); }
  .mini-btn.cancel:hover { background: rgba(255,255,255,0.1); }

  .empty { color: var(--ink-faint); font-size: 13px; padding: 20px 4px; text-align: center; font-style: italic; }

  .img-upload-btn {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .img-upload-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(123,97,255,0.4); }
  .img-upload-btn:active { transform: scale(0.95); }
  .img-upload-btn input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
  }

  .quick-img-preview {
    width: 46px;
    height: 46px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    border: 1px solid rgba(123,97,255,0.5);
    flex-shrink: 0;
    cursor: pointer;
  }

  .task-image {
    width: 100%;
    max-width: 200px;
    border-radius: var(--radius-sm);
    margin-top: 8px;
    cursor: pointer;
    transition: transform 0.2s ease;
    flex-basis: 100%;
  }
  .task-image:hover { transform: scale(1.02); }
  .task-image:active { transform: scale(0.98); }

  .task-file {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 260px;
    margin-top: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: rgba(123,97,255,0.12);
    border: 1px solid rgba(123,97,255,0.35);
    color: #c7b8ff;
    font-size: 13px;
    text-decoration: none;
    flex-basis: 100%;
    transition: background 0.2s ease;
  }
  .task-file:hover { background: rgba(123,97,255,0.2); }
  .task-file:active { transform: scale(0.98); }

  .task-pdf,
  .task-video,
  .task-audio {
    width: 100%;
    max-width: 260px;
    margin-top: 8px;
    border-radius: var(--radius-sm);
    flex-basis: 100%;
  }
  .task-pdf { min-height: 220px; border: 1px solid rgba(123,97,255,0.3); background: rgba(0,0,0,0.25); }
  .task-video { background: #000; }
  .task-audio { height: 40px; }

  .task-text-preview {
    width: 100%;
    max-width: 260px;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: rgba(123,97,255,0.08);
    border: 1px solid rgba(123,97,255,0.25);
    color: #d4c8ff;
    font-size: 12px;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 160px;
    overflow: auto;
    flex-basis: 100%;
  }

  .file-preview {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 180px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    background: rgba(123,97,255,0.12);
    border: 1px solid rgba(123,97,255,0.4);
    color: #c7b8ff;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .img-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: pointer;
  }
  .img-lightbox.show { display: flex; }
  .img-lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: var(--radius);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  @media (min-width: 720px) {
    .tabs { display: none; }
    .lanes { grid-template-columns: 1fr 1fr; }
    .lane[data-inactive="true"] { display: flex; }
  }
  @media (max-width: 719px) {
    .lane[data-inactive="true"] { display: none; }

    body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }

    header {
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .header-left { gap: 8px; flex: 1; min-width: 0; }
    header h1 { font-size: 18px; }
    .sync-status { font-size: 9px; padding: 3px 8px; }
    .clock { font-size: 11px; padding: 5px 10px; }

    .quick-add { padding: 10px; gap: 8px; margin-bottom: 14px; }
    .quick-add input { font-size: 16px; padding: 12px; }
    .add-btn { padding: 12px 16px; font-size: 13px; }

    .unassigned-lane { margin-bottom: 14px; }
    .lane { padding: 14px; }
    .lane-head { margin-bottom: 12px; gap: 8px; }
    .lane-head h2 { font-size: 12px; }

    .tabs { margin-bottom: 14px; gap: 6px; }
    .tab { padding: 12px 10px; font-size: 12px; gap: 6px; }
    .tab .count-badge { font-size: 10px; padding: 2px 6px; }

    .task-row { padding: 12px 4px; gap: 8px; flex-wrap: wrap; }
    .task-text { font-size: 14px; flex: 1 1 100%; }
    .task-meta { font-size: 10px; margin-right: auto; }

    .icon-btn { opacity: 0.6; width: 32px; height: 32px; font-size: 14px; }
    .done-btn { width: 36px; height: 36px; font-size: 15px; }

    .assign-btn { padding: 8px 14px; font-size: 12px; }

    .edit-input { font-size: 15px; padding: 10px; }
    .mini-btn { padding: 10px 14px; font-size: 12px; }

    .empty { font-size: 12px; padding: 16px 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .task-row, .lane-count, .tab, .add-btn, .done-btn, .icon-btn { transition: none; }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-row { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-left">
        <h1>Task Queue</h1>
        <div class="sync-status" id="syncStatus" title="Click to configure sync">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncLabel">Local</span>
        </div>
      </div>
      <div class="clock" id="clock"></div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <div class="quick-add">
      <input type="text" id="quickInput" placeholder="Task lakho…" autocomplete="off" autocorrect="off" />
      <label class="img-upload-btn" title="File attach karo (photo, PDF, doc, etc.)">
        📎
        <input type="file" id="imgInput" />
      </label>
      <button class="img-upload-btn" id="pasteImgBtn" title="Clipboard thi photo paste karo" type="button">
        📋
      </button>
      <button class="add-btn" id="quickAddBtn" type="button">Add</button>
    </div>

    <section class="lane unassigned-lane" id="unassignedLane">
      <div class="lane-head">
        <span class="dot unassigned"></span>
        <h2>Unassigned</h2>
        <span class="lane-count" data-count="unassigned">0</span>
      </div>
      <ul class="task-list" id="list-unassigned"><li class="empty">Koi unassigned task nathi.</li></ul>
    </section>

    <div class="tabs" id="tabs">
      <button class="tab active" data-lane="infra" type="button">
        <span class="dot infra"></span> Infra <span class="count-badge" data-count="infra">0</span>
      </button>
      <button class="tab" data-lane="developers" type="button">
        <span class="dot developers"></span> Developers <span class="count-badge" data-count="developers">0</span>
      </button>
    </div>

    <div class="lanes" id="lanes">
      <section class="lane" data-lane="infra">
        <div class="lane-head">
          <span class="dot infra"></span>
          <h2>Infra</h2>
          <span class="lane-count" data-count="infra">0</span>
        </div>
        <ul class="task-list" id="list-infra"><li class="empty">Loading…</li></ul>
      </section>

      <section class="lane" data-lane="developers" data-inactive="true">
        <div class="lane-head">
          <span class="dot developers"></span>
          <h2>Developers</h2>
          <span class="lane-count" data-count="developers">0</span>
        </div>
        <ul class="task-list" id="list-developers"><li class="empty">Loading…</li></ul>
      </section>
    </div>
  </div>

  <div class="img-lightbox" id="imgLightbox">
    <img id="lightboxImg" src="" alt="Full size" />
  </div>

  <script>
    (function() {
      const lb = document.getElementById('imgLightbox');
      const lbImg = document.getElementById('lightboxImg');
      document.addEventListener('click', function(e) {
        if (e.target.classList.contains('task-image') || e.target.classList.contains('quick-img-preview')) {
          lbImg.src = e.target.src;
          lb.classList.add('show');
        }
      });
      lb.addEventListener('click', function() {
        lb.classList.remove('show');
        lbImg.src = '';
      });
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    const STORAGE_KEY = 'daily-tasks';
    let tasks = [];
    let activeLane = 'infra';
    let lastCounts = { unassigned: 0, infra: 0, developers: 0 };
    let editingId = null;
    let fbDb = null;
    let fbRef = null;
    let pendingImage = null;
    let pendingFile = null;

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
    }

    async function storageGet(key) {
      if (CLAUDE_STORAGE) {
        try { const res = await withTimeout(window.storage.get(key, false), 2500); return res ? res.value : null; }
        catch (e) { try { return localStorage.getItem(key); } catch (e2) { return null; } }
      }
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    async function storageSet(key, value) {
      if (CLAUDE_STORAGE) {
        try { const result = await withTimeout(window.storage.set(key, value, false), 2500); return !!result; }
        catch (e) { try { localStorage.setItem(key, value); return true; } catch (e2) { return false; } }
      }
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }

    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function showError(msg) {
      const b = document.getElementById('errorBanner');
      b.textContent = msg;
      b.classList.add('show');
    }

    function compressImage(file, maxW, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function clearPendingAttachment() {
      pendingImage = null;
      pendingFile = null;
      const qa = document.querySelector('.quick-add');
      const existingImg = qa.querySelector('.quick-img-preview');
      const existingFile = qa.querySelector('.file-preview');
      if (existingImg) existingImg.remove();
      if (existingFile) existingFile.remove();
    }

    function setPendingImage(dataUrl) {
      clearPendingAttachment();
      pendingImage = dataUrl;
      const qa = document.querySelector('.quick-add');
      const preview = document.createElement('img');
      preview.className = 'quick-img-preview';
      preview.src = dataUrl;
      preview.title = 'Click to remove';
      preview.onclick = clearPendingAttachment;
      qa.insertBefore(preview, document.getElementById('quickAddBtn'));
    }

    function mimeFromDataUrl(dataUrl) {
      return (dataUrl.match(/^data:([^;]+)/) || ['', ''])[1];
    }

    function filePreviewLabel(name, type) {
      const map = { pdf: '📄', audio: '🎵', video: '🎬', txt: '📝', csv: '📊', doc: '📃', xls: '📊', ppt: '📽️' };
      if (type.startsWith('image/')) return '🖼️';
      if (type.startsWith('audio/')) return map.audio;
      if (type.startsWith('video/')) return map.video;
      if (type === 'application/pdf') return map.pdf;
      if (type.includes('spreadsheet') || type.includes('excel') || name.match(/\.(xlsx?|csv)$/i)) return map.xls;
      if (type.includes('word') || name.match(/\.(docx?)$/i)) return map.doc;
      if (type.includes('powerpoint') || name.match(/\.(pptx?)$/i)) return map.ppt;
      if (type.startsWith('text/') || name.match(/\.(txt|md|json)$/i)) return map.txt;
      return '📎';
    }

    function setPendingFile(dataUrl, name, size, type) {
      clearPendingAttachment();
      pendingFile = { data: dataUrl, name, size, type };
      const qa = document.querySelector('.quick-add');
      const preview = document.createElement('span');
      preview.className = 'file-preview';
      preview.title = 'Click to remove';
      preview.textContent = filePreviewLabel(name, type || mimeFromDataUrl(dataUrl)) + ' ' + name + ' (' + formatBytes(size) + ')';
      preview.onclick = clearPendingAttachment;
      qa.insertBefore(preview, document.getElementById('quickAddBtn'));
    }

    document.getElementById('imgInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showError('File 5MB thi motu che. Nanu file upload karo.');
        e.target.value = '';
        return;
      }
      try {
        if (file.type.startsWith('image/')) {
          setPendingImage(await compressImage(file, 600, 0.6));
        } else {
          setPendingFile(await readFileAsDataUrl(file), file.name, file.size, file.type);
        }
      } catch (err) {
        showError('File upload nathi thati.');
      }
      e.target.value = '';
    });

    document.getElementById('pasteImgBtn').addEventListener('click', async function() {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        showError('Aa browser clipboard access aapi nathi. Photo save kari ne 📷 thi select karo.');
        return;
      }
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const type = item.types.find(t => t.startsWith('image/'));
          if (!type) continue;
          const blob = await item.getType(type);
          setPendingImage(await compressImage(blob, 600, 0.6));
          return;
        }
        showError('Clipboard ma photo nathi. Pehla WhatsApp ma photo Copy karo.');
      } catch (err) {
        showError('Clipboard access nathi malyo. Photo save kari ne 📷 thi select karo.');
      }
    });

    document.addEventListener('paste', async function(e) {
      const item = Array.from(e.clipboardData?.items || []).find(i => i.type.startsWith('image/'));
      if (!item) return;
      const file = item.getAsFile();
      if (!file) return;
      e.preventDefault();
      if (file.size > 5 * 1024 * 1024) { showError('File 5MB thi motu che.'); return; }
      try {
        setPendingImage(await compressImage(file, 600, 0.6));
      } catch (err) {
        showError('Photo compress nathi thati.');
      }
    });

    function setSyncStatus(state, label) {
      const dot = document.getElementById('syncDot');
      const lbl = document.getElementById('syncLabel');
      dot.className = 'sync-dot ' + state;
      lbl.textContent = label;
    }

    // --- Firebase Sync ---
    function initFirebase(config) {
      try {
        if (firebase.apps.length) firebase.app().delete();
      } catch (e) {}

      try {
        const app = firebase.initializeApp(config);
        fbDb = firebase.database(app);
        fbRef = fbDb.ref('task-queue/tasks');

        setSyncStatus('connecting', 'Syncing…');

        fbRef.on('value', (snapshot) => {
          const remote = snapshot.val();
          if (Array.isArray(remote)) {
            const obj = {};
            remote.forEach(t => { if (t && t.id) obj[t.id] = t; });
            fbRef.set(obj);
            return;
          }
          tasks = remote ? Object.keys(remote).map(k => remote[k]).filter(Boolean) : [];
          storageSet(STORAGE_KEY, JSON.stringify(tasks));
          render();
          setSyncStatus('connected', 'Live');
        }, (err) => {
          console.error('Firebase read error:', err);
          setSyncStatus('offline', 'Error');
          showError('Sync error: ' + err.message);
        });

        fbDb.ref('.info/connected').on('value', (snap) => {
          if (snap.val() === true) {
            setSyncStatus('connected', 'Live');
          } else {
            setSyncStatus('connecting', 'Reconnecting…');
          }
        });

      } catch (e) {
        console.error('Firebase init error:', e);
        setSyncStatus('offline', 'Error');
        showError('Could not connect to Firebase.');
      }
    }

    function syncTask(id) {
      if (!fbRef) return;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      fbRef.child(id).set(t).catch(err => {
        console.error('Firebase write error:', err);
      });
    }

    function removeTaskRemote(id) {
      if (!fbRef) return;
      fbRef.child(id).remove().catch(err => {
        console.error('Firebase write error:', err);
      });
    }

    // --- Tasks ---
    async function loadTasks() {
      const raw = await storageGet(STORAGE_KEY);
      try { tasks = raw ? JSON.parse(raw) : []; } catch (e) { tasks = []; }
      render();
    }

    async function saveTasks() {
      const ok = await storageSet(STORAGE_KEY, JSON.stringify(tasks));
      if (!ok) showError('Could not save changes locally.');
    }

    function addTask(category, text, attachment) {
      const trimmed = text.trim();
      if (!trimmed) return;
      const task = {
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        category, text: trimmed, done: false,
        createdAt: new Date().toISOString()
      };
      if (attachment) {
        if (typeof attachment === 'string') {
          task.image = attachment;
        } else if (attachment.data) {
          task.file = attachment;
        }
      }
      tasks.push(task);
      saveTasks();
      syncTask(task.id);
      render();
    }

    function assignTask(id, category) {
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      t.category = category;
      saveTasks();
      syncTask(id);
      render();
    }

    function toggleDone(id) {
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      t.done = !t.done;
      saveTasks();
      syncTask(id);
      render();
    }

    function startEdit(id) { editingId = id; render(); }

    function saveEdit(id, newText) {
      const trimmed = newText.trim();
      if (!trimmed) return;
      const t = tasks.find(t => t.id === id);
      if (t) t.text = trimmed;
      editingId = null;
      saveTasks();
      syncTask(id);
      render();
    }

    function cancelEdit() { editingId = null; render(); }

    function deleteTask(id) {
      const row = document.querySelector('[data-id="' + id + '"]');
      if (row) {
        row.classList.add('removing');
        setTimeout(() => { tasks = tasks.filter(t => t.id !== id); saveTasks(); removeTaskRemote(id); render(); }, 250);
      } else {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        removeTaskRemote(id);
        render();
      }
    }

    function taskRowHtml(t, cat) {
      if (editingId === t.id) {
        return '<li class="task-row editing" data-id="' + t.id + '">' +
          '<input type="text" class="edit-input" value="' + escapeHtml(t.text) + '" />' +
          '<div class="edit-actions">' +
            '<button class="mini-btn save" data-id="' + t.id + '" type="button">Save</button>' +
            '<button class="mini-btn cancel" type="button">Cancel</button>' +
          '</div></li>';
      }
      const assignHtml = cat === 'unassigned'
        ? '<div class="assign-row">' +
            '<button class="assign-btn infra" data-id="' + t.id + '" data-cat="infra" type="button">Infra</button>' +
            '<button class="assign-btn developers" data-id="' + t.id + '" data-cat="developers" type="button">Dev</button>' +
          '</div>'
        : '<button class="done-btn ' + cat + (t.done ? ' checked' : '') + '" data-id="' + t.id + '" aria-label="Mark done" type="button">✓</button>';
      const attachHtml = (function() {
        if (t.image) return '<img class="task-image" src="' + t.image + '" alt="task photo" />';
        if (!t.file) return '';
        const f = t.file, type = f.type || mimeFromDataUrl(f.data), name = f.name || 'file';
        if (type.startsWith('image/')) return '<img class="task-image" src="' + f.data + '" alt="' + escapeHtml(name) + '" />';
        if (type === 'application/pdf') return '<embed class="task-pdf" src="' + f.data + '" type="application/pdf" width="100%" height="220" />';
        if (type.startsWith('video/')) return '<video class="task-video" src="' + f.data + '" controls width="100%" preload="metadata"></video>';
        if (type.startsWith('audio/')) return '<audio class="task-audio" src="' + f.data + '" controls preload="metadata"></audio>';
        if (type.startsWith('text/') || name.match(/\.(txt|md|csv|json|log)$/i)) {
          try {
            const raw = atob(f.data.split(',')[1] || '');
            const snippet = escapeHtml(raw.slice(0, 400));
            return '<pre class="task-text-preview">' + snippet + (raw.length > 400 ? '\n…' : '') + '</pre>';
          } catch (e) {
            return '<a class="task-file" href="' + f.data + '" download="' + escapeHtml(name) + '" target="_blank">' + filePreviewLabel(name, type) + ' ' + escapeHtml(name) + ' (' + formatBytes(f.size) + ')</a>';
          }
        }
        return '<a class="task-file" href="' + f.data + '" download="' + escapeHtml(name) + '" target="_blank">' + filePreviewLabel(name, type) + ' ' + escapeHtml(name) + ' (' + formatBytes(f.size) + ')</a>';
      })();
      return '<li class="task-row' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
        '<div class="task-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</div>' +
        attachHtml +
        '<div class="task-meta">' + formatTime(t.createdAt) + '</div>' +
        '<div class="row-actions">' + assignHtml +
          '<button class="icon-btn edit-btn" data-id="' + t.id + '" aria-label="Edit" type="button">✏️</button>' +
          '<button class="icon-btn delete-btn" data-id="' + t.id + '" aria-label="Delete" type="button">🗑️</button>' +
        '</div></li>';
    }

    function render() {
      ['unassigned', 'infra', 'developers'].forEach(cat => {
        const items = tasks
          .filter(t => t.category === cat)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        document.querySelectorAll('[data-count="' + cat + '"]').forEach(el => { el.textContent = items.length; });

        if (items.length !== lastCounts[cat]) {
          document.querySelectorAll('.lane-count[data-count="' + cat + '"]').forEach(el => {
            el.classList.add('flash', cat);
            setTimeout(() => el.classList.remove('flash', cat), 350);
          });
          lastCounts[cat] = items.length;
        }

        const list = document.getElementById('list-' + cat);
        if (items.length === 0) {
          list.innerHTML = '<li class="empty">' + (cat === 'unassigned' ? 'Koi unassigned task nathi.' : 'Nothing pending in ' + (cat === 'infra' ? 'Infra' : 'Developers') + '.') + '</li>';
          return;
        }
        list.innerHTML = items.map(t => taskRowHtml(t, cat)).join('');
      });

      document.querySelectorAll('.done-btn').forEach(btn => { btn.onclick = () => toggleDone(btn.dataset.id); });
      document.querySelectorAll('.assign-btn').forEach(btn => { btn.onclick = () => assignTask(btn.dataset.id, btn.dataset.cat); });
      document.querySelectorAll('.edit-btn').forEach(btn => { btn.onclick = () => startEdit(btn.dataset.id); });
      document.querySelectorAll('.delete-btn').forEach(btn => { btn.onclick = () => deleteTask(btn.dataset.id); });
      document.querySelectorAll('.mini-btn.save').forEach(btn => {
        const li = btn.closest('.task-row');
        const input = li.querySelector('.edit-input');
        const submit = () => saveEdit(btn.dataset.id, input.value);
        btn.onclick = submit;
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      });
      document.querySelectorAll('.mini-btn.cancel').forEach(btn => { btn.onclick = cancelEdit; });
      const activeInput = document.querySelector('.edit-input');
      if (activeInput) { activeInput.focus(); activeInput.select(); }
    }

    function setActiveLane(lane) {
      activeLane = lane;
      document.querySelectorAll('.tab').forEach(tab => { tab.classList.toggle('active', tab.dataset.lane === lane); });
      document.querySelectorAll('.lane[data-lane]').forEach(section => { section.dataset.inactive = section.dataset.lane === lane ? 'false' : 'true'; });
    }

    document.querySelectorAll('.tab').forEach(tab => { tab.addEventListener('click', () => setActiveLane(tab.dataset.lane)); });

    const quickInput = document.getElementById('quickInput');
    const quickBtn = document.getElementById('quickAddBtn');
    const quickSubmit = () => {
      addTask('unassigned', quickInput.value, pendingImage || pendingFile);
      quickInput.value = '';
      clearPendingAttachment();
      quickInput.focus();
    };
    quickBtn.addEventListener('click', quickSubmit);
    quickInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') quickSubmit(); });

    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      document.getElementById('clock').textContent = dateStr + ' · ' + timeStr;
    }
    updateClock();
    setInterval(updateClock, 30000);

    // --- Firebase Config (hardcoded) ---
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDbE1FH_kN-lfxRmPrw3vCO7imlmOUiQe8",
      authDomain: "task-6271f.firebaseapp.com",
      databaseURL: "https://task-6271f-default-rtdb.firebaseio.com",
      projectId: "task-6271f"
    };

    // --- Init ---
    (async function boot() {
      await loadTasks();
      initFirebase(FIREBASE_CONFIG);
    })();
  </script>
</body>
</html>
